name: Import approved trustee photos (one-time)

on:
  push:
    branches: [improve/trustees-banner-zanang-profile]
    paths: ['.import/ofd-trustees-photo-update.zip']

permissions:
  contents: write

concurrency:
  group: ofd-trustee-photo-update
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out trustee photo change branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Import exact approved original photographs
        run: python3 .github/scripts/import_trustee_update.py
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Compile and lint updated website
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint
      - name: Commit portraits and remove temporary importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/Trustees/Trustess.jsx src/assets/trustees/trustees-hero.jpg src/assets/trustees/zanang-diana-awan.jpg
          git rm -f .import/ofd-trustees-photo-update.zip .import/README.md .github/scripts/import_trustee_update.py .github/workflows/import-trustee-update.yml
          git commit -m "Add approved Trustees page banner and Zanang Diana Awan portrait"
          git push origin HEAD:improve/trustees-banner-zanang-profile
