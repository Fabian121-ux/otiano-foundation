name: Import approved trustee photographs

on:
  push:
    branches: [improve/homepage-content-refinement]
    paths: ['.import/trustee-photos.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trustee-portrait-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and import seven approved photographs
        run: python3 .github/scripts/import_trustees.py
      - name: Commit portrait images and mapped profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update seven trustee portraits and approved display order"
          git push origin HEAD:improve/homepage-content-refinement
