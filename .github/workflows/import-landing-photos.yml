name: Import approved OFD landing photos

on:
  push:
    branches: [improve/landing-photos-and-home-cta]
    paths: ['.import/landing-photos.zip', '.github/scripts/import_landing_photos.py']

permissions:
  contents: write

concurrency:
  group: ofd-import-landing-photos
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Import checksum-verified approved photos and update slide sources
        run: python3 .github/scripts/import_landing_photos.py
      - name: Commit original photos and slider mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use approved OFD photos in homepage landing carousel"
          git push origin HEAD:improve/landing-photos-and-home-cta
