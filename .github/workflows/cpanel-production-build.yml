name: Compile production frontend for cPanel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-build-main
  cancel-in-progress: false

jobs:
  production-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Browser-visible URLs taken from the previous developer's .env.production.
      VITE_API_BASE_URL: https://api.otianofoundation.org/api
      VITE_UPLOAD_URL: https://api.otianofoundation.org/uploads
    steps:
      - name: Checkout approved main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile frontend
        run: npm run build
      - name: Exclude Apache configuration and validate deployment files
        run: |
          rm -f dist/.htaccess
          python3 scripts/validate_frontend_dist.py
      - name: Commit only compiled frontend files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A -- dist/
          if git diff --cached --quiet; then
            echo 'Frontend build unchanged'
            exit 0
          fi
          git commit -m 'build: refresh cPanel frontend assets [skip ci]'
          git push origin HEAD:main
