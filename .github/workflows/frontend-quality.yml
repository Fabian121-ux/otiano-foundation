name: Frontend quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'improve/**']
    paths-ignore:
      - 'dist/**'

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: Install browser tooling for QA only
        if: always()
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive layouts and navigation
        if: always()
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/otiano-preview.log 2>&1 &
          node scripts/check-responsive.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa
          path: artifacts/responsive
          if-no-files-found: ignore
