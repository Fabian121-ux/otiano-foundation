name: Frontend build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/frontend-deployment-preparation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compile-only endpoints. Hosting endpoints remain unverified.
      VITE_API_BASE_URL: https://example.invalid/api
      VITE_UPLOAD_URL: https://example.invalid/uploads
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Validate and package frontend allowlist
        run: python3 .github/scripts/package_frontend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-ci-only-${{ github.sha }}
          path: frontend-ci-only.zip
          if-no-files-found: error
          retention-days: 7
